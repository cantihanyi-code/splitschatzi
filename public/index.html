<script>
// Theme vor dem ersten Paint setzen (kein Aufblitzen)
try{var t=(JSON.parse(localStorage.getItem('ss_local'))||{});t=t.theme||(t.dark===false?'light':t.dark===true?'dark':'auto');
document.documentElement.dataset.theme=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch(e){document.documentElement.dataset.theme='dark'}
</script>
